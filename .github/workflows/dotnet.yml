name: Client

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semantic-conventions:
    name: semantic-conventions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install semantic convention tooling
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.8.2
          install_args: github:open-telemetry/weaver
          cache: false
      - name: Verify semantic conventions
        run: mise run --skip-tools semconv:check

  vulnerability-scan:
    name: scan-vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Scan dependencies
        shell: bash
        run: |
          set -o pipefail
          dotnet restore KurrentDB.Client.sln
          dotnet list KurrentDB.Client.sln package \
            --vulnerable \
            --include-transitive \
            --format json \
            --output-version 1 > vulnerabilities.json
          jq -e '[.projects[] | (.frameworks // [])[] | ((.topLevelPackages // []) + (.transitivePackages // []))[]] | length == 0' vulnerabilities.json

  build:
    name: build/net10.0
    runs-on: ubuntu-latest
    env:
      UNIT_TEST_FILTER: >-
        FullyQualifiedName~KurrentDB.Client.Tests.KurrentDBClientOperationOptionsTests.|
        FullyQualifiedName~KurrentDB.Client.Tests.ConnectionStringTests.|
        FullyQualifiedName~KurrentDB.Client.Tests.FromStreamTests.|
        FullyQualifiedName~KurrentDB.Client.Tests.ValueObjectTests.|
        FullyQualifiedName~KurrentDB.Client.Tests.UuidTests.|
        FullyQualifiedName~KurrentDB.Client.Tests.StreamStateTests.|
        FullyQualifiedName~KurrentDB.Client.Tests.PositionTests.|
        FullyQualifiedName~KurrentDB.Client.Tests.NodePreferenceComparerTests.|
        FullyQualifiedName~KurrentDB.Client.Tests.NodeSelectorTests.|
        FullyQualifiedName~KurrentDB.Client.Tests.StreamPositionTests.|
        FullyQualifiedName~KurrentDB.Client.Tests.Compatibility.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore KurrentDB.Client.sln
      - name: Build
        run: >-
          dotnet build test/KurrentDB.Client.Tests/KurrentDB.Client.Tests.csproj
          --configuration Release
          --framework net10.0
          --no-restore
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          results_directory="${RUNNER_TEMP}/test-results/net10.0"
          mkdir -p "$results_directory"
          dotnet test test/KurrentDB.Client.Tests/KurrentDB.Client.Tests.csproj \
            --configuration Release \
            --framework net10.0 \
            --no-build \
            --filter "$UNIT_TEST_FILTER" \
            --logger "trx;LogFileName=results.trx" \
            --results-directory "$results_directory"
          grep -Eq '<Counters total="[1-9][0-9]*"' "$results_directory/results.trx"
