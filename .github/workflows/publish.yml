name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git reference to package
        required: true
        default: main
      version:
        description: Optional package version
        required: false
        default: ""

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            if [[ ! "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "Version must be a valid SemVer 2.0 version." >&2
              exit 1
            fi
            echo "value=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "skip_minver=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(dotnet tool run minver -- --tag-prefix=v)" >> "$GITHUB_OUTPUT"
            echo "skip_minver=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
          SKIP_MINVER: ${{ steps.version.outputs.skip_minver }}
        run: |
          minver_flag=""
          if [ "$SKIP_MINVER" = "true" ]; then
            minver_flag="/p:MinVerSkip=true"
          fi
          dotnet pack src/KurrentDB.Client/KurrentDB.Client.csproj \
            --configuration Release \
            --output packages \
            /p:Version="$PACKAGE_VERSION" \
            $minver_flag
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: packages

  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download package artifact
        uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: packages
      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          mapfile -t package_paths < <(find packages -maxdepth 1 -type f -name '*.nupkg' ! -name '*.symbols.nupkg')
          if [ "${#package_paths[@]}" -ne 1 ]; then
            echo "Expected exactly one NuGet package, found ${#package_paths[@]}." >&2
            exit 1
          fi
          dotnet nuget push "${package_paths[0]}" \
            --api-key "$GITHUB_TOKEN" \
            --source "https://nuget.pkg.github.com/${REGISTRY_OWNER}/index.json"
