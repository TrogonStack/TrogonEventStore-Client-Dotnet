name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      server_image:
        description: Fully qualified TrogonEventStore container image
        required: false
        default: ghcr.io/trogonstack/trogoneventstore:ci
        type: string
      registry:
        description: Registry host for a private image; requires REGISTRY_USERNAME and REGISTRY_TOKEN secrets
        required: false
        type: string
permissions:
  contents: read

jobs:
  test:
    name: integration/net10.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install .NET SDKs
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Log in to container registry
        if: ${{ inputs.registry != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Run integration tests
        env:
          TESTCONTAINER_KURRENTDB_IMAGE: ${{ inputs.server_image }}
        run: |
          sudo ./gencert.sh
          dotnet test test/KurrentDB.Client.Tests \
            --configuration Release \
            --framework net10.0 \
            --blame \
            --logger "GitHubActions;report-warnings=false" \
            --logger "console;verbosity=normal"
